name: Build app installers

# Push a tag like "v1.0.1" to cut a new release: this builds unsigned Mac
# (arm64 + x64) and Windows installers and attaches them to a GitHub
# Release under stable filenames. The website always links to
# .../releases/latest/download/<filename>, which GitHub resolves to
# whatever the newest release's matching asset is.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes

  build-mac:
    needs: create-release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build-mac
      - name: Rename artifacts to stable filenames
        run: |
          mkdir -p out
          cp dist/*-arm64.dmg "out/1CloudHub-Tracker-mac-arm64.dmg"
          cp "$(ls dist/*.dmg | grep -v arm64)" "out/1CloudHub-Tracker-mac-x64.dmg"
      - name: Upload to the release
        working-directory: app/out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" * --clobber

  build-win:
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build-win
      - name: Rename artifact to stable filename
        shell: bash
        run: |
          mkdir -p out
          cp dist/*.exe "out/1CloudHub-Tracker-win-x64.exe"
      - name: Upload to the release
        working-directory: app/out
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" * --clobber
